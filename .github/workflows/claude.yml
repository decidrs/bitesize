name: claude
# The engine: "@claude" in an issue or comment from a repo collaborator starts a Claude Code run.
# It works on its own branch and opens a PR; it never merges or pushes to main.
# Auth: secret CLAUDE_CODE_OAUTH_TOKEN (founder adds it; from `claude setup-token`).

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash(gh pr create:*),Bash(gh pr view:*)"
